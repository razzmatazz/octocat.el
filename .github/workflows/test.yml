name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        emacs: ["30", "31"]

    env:
      EMACS: ${{ matrix.emacs }}
      # The image is built below, with the layer cache, not by make.
      SKIP_IMAGE: 1

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Emacs 31 is built from source, so caching its layers saves minutes.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: EMACS=${{ matrix.emacs }}
          tags: octocat-test:emacs-${{ matrix.emacs }}
          load: true
          cache-from: type=gha,scope=emacs-${{ matrix.emacs }}
          cache-to: type=gha,mode=max,scope=emacs-${{ matrix.emacs }}

      - name: Cache Eask dependencies
        uses: actions/cache@v4
        with:
          path: .eask
          key: eask-${{ matrix.emacs }}-${{ hashFiles('Eask') }}

      - name: Compile
        run: make compile

      - name: Lint
        run: make lint

      - name: Run ERT tests
        run: make test
