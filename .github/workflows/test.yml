name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "30.2", "31.1"]

    env:
      EMACS: ${{ matrix.emacs }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # As `make image', but caching the layers, as Emacs 31 is built from
      # source and that takes minutes.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: EMACS=${{ matrix.emacs }}
          tags: octocat-test:emacs-${{ matrix.emacs }}
          load: true
          cache-from: type=gha,scope=emacs-${{ matrix.emacs }}
          cache-to: type=gha,mode=max,scope=emacs-${{ matrix.emacs }}

      # Only to save fetching: `make deps' upgrades what it restores, as
      # no file names the snapshots it installs.  Each run saves its own,
      # and the next restores the newest.
      - name: Cache Eldev dependencies
        uses: actions/cache@v4
        with:
          path: .eldev
          key: eldev-${{ matrix.emacs }}-${{ github.run_id }}
          restore-keys: eldev-${{ matrix.emacs }}-

      - name: Install dependencies
        run: make deps

      - name: Compile
        run: make compile

      - name: Lint
        run: make lint

      - name: Run ERT tests
        run: make test

