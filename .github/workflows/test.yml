name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "30.2", "31.1"]

    env:
      EMACS: ${{ matrix.emacs }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # As `make image', but caching the layers, as Emacs 31 is built from
      # source and that takes minutes.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: EMACS=${{ matrix.emacs }}
          tags: octocat-test:emacs-${{ matrix.emacs }}
          load: true
          cache-from: type=gha,scope=emacs-${{ matrix.emacs }}
          cache-to: type=gha,mode=max,scope=emacs-${{ matrix.emacs }}

      # The dependencies are named by Eldev and octocat.el's
      # Package-Requires header, not by the rest of octocat.el.
      - name: Find the dependencies
        id: deps
        run: echo "hash=$(grep '^;; Package-Requires:' octocat.el | cat - Eldev | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Eldev dependencies
        uses: actions/cache@v4
        with:
          path: .eldev
          key: eldev-${{ matrix.emacs }}-${{ steps.deps.outputs.hash }}

      - name: Install dependencies
        run: make deps

      - name: Compile
        run: make compile

      - name: Lint
        run: make lint

      - name: Run ERT tests
        run: make test

      # On one release only: melpazoid builds its own Emacs 31, as MELPA's
      # reviewers do, whichever this job tests, see the Makefile.  Some
      # of its checks run an emacs of the host's, which the runner lacks.
      - name: Install Emacs for melpazoid
        if: matrix.emacs == '31.1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq emacs-nox

      - name: Run melpazoid
        if: matrix.emacs == '31.1'
        run: make melpazoid
